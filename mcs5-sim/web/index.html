<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MCS-5 Trainer</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="top">
  <div class="brand"><b>MCS-5</b> Trainer <span id="shipname"></span></div>
  <button id="alarmbar" class="alarmbar" title="Open alarm list"><span id="abRed" class="cnt red">0</span><span id="abYel" class="cnt yel">0</span><span id="abTxt">No alarms</span></button>
  <div class="tools">
    <select id="speed" title="Simulation speed"><option value="1">1x</option><option value="2">2x</option><option value="5">5x</option><option value="10">10x</option></select>
    <button id="mute" title="Alarm horn">🔔</button>
    <span id="clock"></span>
  </div>
</header>
<main id="view"></main>
<nav id="nav"></nav>

<div id="loader" hidden>
  <div class="card">
    <h2>Load ship data</h2>
    <p>This app needs the <b>ship data pack</b> (<code>ship.json</code>) made from your ACP files with <code>tools/acp2json.py</code>. The data stays on this device.</p>
    <input type="file" id="file" accept=".json,application/json">
    <p id="loaderMsg" class="msg"></p>
  </div>
</div>

<script src="js/model.js"></script>
<script src="js/app.js"></script>
</body>
</html>
