name: Build BlockBridge APK

on:
  push:
    paths:
      - "BlockBridge/**"
      - ".gitmodules"
      - ".github/workflows/blockbridge.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BlockBridge
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-go@v5
        with:
          go-version-file: BlockBridge/wg/go.mod
          cache-dependency-path: BlockBridge/wg/go.sum
      - uses: gradle/actions/setup-gradle@v4

      - name: Test VPN helper (bbwg)
        working-directory: BlockBridge/wg
        run: go test -race ./...

      - name: Test and build
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk BlockBridge.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BlockBridge-apk
          path: BlockBridge/BlockBridge.apk

      # Phone-friendly download link: Releases › "BlockBridge (latest build)"
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete blockbridge-latest --yes --cleanup-tag || true
          gh release create blockbridge-latest BlockBridge.apk \
            --target "$GITHUB_SHA" \
            --title "BlockBridge (latest build)" \
            --notes "Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Download BlockBridge.apk on your phone and open it to install." \
            --prerelease
