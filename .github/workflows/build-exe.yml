name: Build Windows exe

on:
  push:
    branches: ["**"]
    paths:
      - "memexplorer/**"
      - "packaging/**"
      - "requirements.txt"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python -m pytest -q
        continue-on-error: true

      - name: Build single-file exe
        run: pyinstaller --clean --noconfirm packaging/memexplorer.spec

      - name: Smoke-test the exe
        run: dist/memexplorer.exe ps --name System

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: memexplorer-exe
          path: dist/memexplorer.exe
          if-no-files-found: error

      - name: Attach exe to a release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/memexplorer.exe
