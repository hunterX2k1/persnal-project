plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fieldhelper.diag'
    compileSdk 34

    defaultConfig {
        applicationId 'com.fieldhelper.diag'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
        ndk {
            // Phones like the Moto Edge 60 Pro are arm64; keeps the APK small
            abiFilters 'arm64-v8a'
        }
    }

    androidResources {
        noCompress 'onnx'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }
}

dependencies {
    // Reads the exact lines and words inside PDF drawings (offline, open source, Apache 2.0)
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    // Runs the small donor model (MiniLM) offline on the phone (MIT licence)
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.19.2'
}
