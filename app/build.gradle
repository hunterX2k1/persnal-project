plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fieldhelper.diag'
    compileSdk 34

    defaultConfig {
        applicationId 'com.fieldhelper.diag'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }
}

dependencies {
    // Reads the exact lines and words inside PDF drawings (offline, open source, Apache 2.0)
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}
