plugins { id 'com.android.application' }
android {
    namespace 'com.docprep.app'
    compileSdk 34
    defaultConfig { applicationId 'com.docprep.app'; minSdk 24; targetSdk 34; versionCode 1; versionName '1.0' }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
dependencies { implementation 'com.tom-roush:pdfbox-android:2.0.27.0' }
